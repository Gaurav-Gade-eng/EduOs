# EduOS disk / memory layout -- the SINGLE source of truth.
# scripts/gen_layout.py turns this into build/gen/boot_constants.inc,
# build/gen/layout.h and build/gen/layout.mk. Never hand-edit those.
# Values are integers (decimal or 0x hex). Lines starting with # are comments.

# ---- Disk layout (512-byte sectors) ----
STAGE2_LBA=1
STAGE2_SECTORS=16
KERNEL_LBA=17
KERNEL_MAX_SECTORS=768
KERNEL_BATCH_SECTORS=64
EDUFS_START_LBA=2048
IMAGE_SIZE_MIB=32

# ---- Low-memory map used by the loader ----
BOOT_INFO_ADDR=0x5000
REAL_STACK_TOP=0x7000
STAGE2_ADDR=0x8000
KERNEL_LOAD_ADDR=0x10000
KERNEL_MAX_END=0x90000
PM_STACK_TOP=0x90000

# ---- Boot protocol ----
BOOT_MAGIC=0x4544554F
BOOT_VERSION=1
BOOT_MAX_RANGES=32
